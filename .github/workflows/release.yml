name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build and verify
        run: |
          bash scripts/make_app.sh release
          codesign --verify --deep --strict dist/cclose-mac.app
          test "$(uname -m)" = arm64
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/cclose-mac.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent cclose-mac.app "CClose-MscOS-$version-arm64.zip"
          shasum -a 256 "CClose-MscOS-$version-arm64.zip" > "CClose-MscOS-$version-arm64.zip.sha256"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "CClose-MscOS $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
